[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "weekly-report-backend"
version = "0.1.0"
description = "Backend for the WeeklyReport Agent project weekly-report workbench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "PyYAML>=6.0.2,<7.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "langgraph>=1.2.9,<1.3.0",
  "langchain-core>=1.4.9,<2.0.0",
  "langchain-openai>=1.1.14,<1.2.0",
  "langgraph-checkpoint-sqlite>=3.0.0,<4.0.0",
  "openai>=2.26.0,<3.0.0",
  "SQLAlchemy>=2.0.40,<3.0.0",
  "Pillow>=13.0.0,<14.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0.0",
  "pytest>=9.0.3,<10.0.0",
]
observability = [
  "langfuse>=3.0.0,<4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
addopts = "-q"
